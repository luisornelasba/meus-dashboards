name: Atualizar dashboard

on:
  push:
    paths:
      - 'entrada/**'
      - 'scripts/etl.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  processar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar as bibliotecas
        run: pip install -r requirements.txt

      - name: Processar a planilha do CRM
        run: python scripts/etl.py

      - name: Publicar a base atualizada
        run: |
          git config user.name  "Robo do Dashboard"
          git config user.email "actions@github.com"
          git add alimentacao/dados.json
          if git diff --staged --quiet; then
            echo "Nenhuma mudanca nos dados - nada a publicar."
          else
            git commit -m "Dados atualizados automaticamente ($(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M'))"
            git push
            echo "Dados publicados. A Vercel republica o site em instantes."
          fi
