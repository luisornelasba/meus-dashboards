name: Atualizar dashboard

# Dispara sozinho quando você sobe uma planilha nova na pasta entrada/
# e também pode ser rodado à mão pelo botão "Run workflow".
on:
  push:
    paths:
      - 'entrada/**'
      - 'scripts/etl.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  processar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar as bibliotecas
        run: pip install -r requirements.txt

      - name: Processar a planilha do CRM
        run: python scripts/etl.py

      - name: Conferir os arquivos gerados
        run: |
          echo "Arquivos de dados presentes apos o ETL:"
          for f in alimentacao/dados.json bp/base.json vacinas/base.json iel/base.json producao-area-mercado/base.json; do
            if [ -f "$f" ]; then
              echo "  OK   $f  ($(du -h "$f" | cut -f1))"
            else
              echo "  --   $f  (nao gerado)"
            fi
          done

      - name: Publicar a base atualizada
        run: |
          git config user.name  "Robo do Dashboard"
          git config user.email "actions@github.com"
          # O dashboard principal (Alimentacao) e os demais alimentados pela
          # mesma planilha. Cada base.json so entra se o ETL tiver gerado.
          git add alimentacao/dados.json
          for pasta in bp vacinas iel producao-area-mercado; do
            if [ -f "$pasta/base.json" ]; then
              git add "$pasta/base.json"
              echo "Incluido no commit: $pasta/base.json"
            fi
          done
          if git diff --staged --quiet; then
            echo "Nenhuma mudanca nos dados - nada a publicar."
          else
            git commit -m "Dados atualizados automaticamente ($(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M'))"
            git push
            echo "Dados publicados. A Vercel republica o site em instantes."
          fi
